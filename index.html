<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EDE1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Doses">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>Doses — medication tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EDE1; --paper-2:#FBF7EF;
    --ink:#1E2A24; --ink-soft:#5C6A61;
    --green:#2E5D4B; --green-dim:#8FA79A;
    --ochre:#C1763C; --clay:#A8503C;
    --bwait:#3F7EA6;       /* wait, then the meal */
    --before:#C1763C;      /* just before the meal */
    --withm:#2E5D4B;       /* with / right after */
    --wait:#8B5CB8;        /* wait after the meal */
    --dep-ink:#6C3F96;     /* text on the wait/dependency tint */
    --on-accent:#F7F3EA;   /* text on solid accent backgrounds */
    --line:rgba(30,42,36,.14);
    --shadow:0 1px 0 rgba(30,42,36,.05), 0 10px 24px -14px rgba(30,42,36,.4);
    --r:16px;
  }
  /* dark theme — light is the default, this only applies when the user flips it */
  html.dark{
    --paper:#151A17; --paper-2:#1F2621;
    --ink:#E8E3D7; --ink-soft:#9DA89F;
    --green:#8CBEA6; --green-dim:#55685D;
    --ochre:#D9975E; --clay:#CE7A64;
    --bwait:#74AACD;
    --before:#D9975E;
    --withm:#8CBEA6;
    --wait:#B492D8;
    --dep-ink:#C9ADE8;
    --on-accent:#13201A;
    --line:rgba(232,227,215,.15);
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;color-scheme:light only;forced-color-adjust:none;-webkit-text-size-adjust:100%}
  html.dark,html.dark body{color-scheme:dark}
  html{background:var(--paper)}
  /* if the host tries to force-darken the page, re-assert the active palette
     (in vars, so the manual dark theme keeps working under system dark too) */
  @media (prefers-color-scheme: dark){
    html,body{background-color:var(--paper) !important;color:var(--ink) !important}
    .card,.med-row,.sheet,.icon-btn,.filters button.on{background-color:var(--paper-2) !important;color:var(--ink) !important}
    input,select,.seg,.gap-opts button{background-color:var(--paper) !important;color:var(--ink) !important}
    .name,.n,h1,h2,h3{color:var(--ink) !important}
  }
  body{
    background:var(--paper);
    background-image:
      radial-gradient(120% 60% at 100% 0%, color-mix(in srgb, var(--ochre) 12%, transparent) 0%, transparent 60%),
      radial-gradient(90% 50% at 0% 100%, color-mix(in srgb, var(--green) 12%, transparent) 0%, transparent 65%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.45; min-height:100dvh;
    padding:calc(22px + env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
  }
  header{margin-bottom:16px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--green);font-weight:700;margin:0 0 6px}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:34px;line-height:1;margin:0;letter-spacing:-.02em}
  h1 em{font-style:italic;color:var(--ochre)}
  /* ---- header ---- */
  .topbar{display:flex;align-items:stretch;justify-content:space-between;gap:14px}
  .tb-left{display:flex;flex-direction:column;justify-content:space-between}
  .tb-right{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;flex:0 0 auto;gap:10px}
  .date{color:var(--ink-soft);font-size:14px;margin:0;text-align:right;line-height:1.2}
  .date.link{cursor:pointer}
  .icons{display:flex;gap:8px;flex:0 0 auto}
  .icon-btn{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);
    color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .18s ease,background .2s}
  .icon-btn:active{transform:scale(.93)}
  .icon-btn.on{background:var(--green);color:var(--on-accent);border-color:var(--green)}
  .icon-btn svg{width:19px;height:19px}

  /* ---- meal tabs ---- */
  .filters{display:flex;gap:4px;margin:18px 0 2px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:13px;padding:4px;box-shadow:var(--shadow)}
  .filters button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-size:13.5px;
    font-weight:700;padding:10px 4px;border-radius:9px;border:none;background:transparent;color:var(--ink-soft);
    cursor:pointer;transition:all .2s}
  .filters button .dot{opacity:.35;transition:opacity .2s}
  .filters button.on{background:var(--green);color:var(--on-accent)}
  .filters button.on .dot{opacity:1}
  .filters .badge{min-width:19px;height:19px;padding:0 5px;border-radius:7px;background:color-mix(in srgb, var(--ink) 12%, transparent);
    color:var(--ink-soft);font-size:11px;font-weight:700;display:grid;place-items:center}
  .filters button.on .badge{background:color-mix(in srgb, var(--on-accent) 25%, transparent);color:var(--on-accent)}
  .filters .badge.clear{background:transparent;color:var(--green);font-size:13px}
  .filters button.on .badge.clear{background:transparent;color:var(--on-accent)}
  .filters .badge:empty{display:none}
  .view{display:none}
  .view.on{display:block;animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---- meal day list ---- */
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .dot.breakfast{background:var(--ochre)}
  .dot.lunch{background:var(--green)}
  .dot.dinner{background:var(--clay)}
  .dot.soon{background:var(--green-dim)}
  .dot.fin{background:color-mix(in srgb, var(--ink) 25%, transparent)}

  /* ---- timing group ---- */
  .grp-head{display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
  .grp-head .pip{width:16px;height:3px;border-radius:99px}
  .grp-head span{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .g-bwait .pip,.g-bwait span{color:var(--bwait)}  .g-bwait .pip{background:var(--bwait)}
  .g-before .pip,.g-before span{color:var(--before)} .g-before .pip{background:var(--before)}
  .g-with .pip,.g-with span{color:var(--withm)}    .g-with .pip{background:var(--withm)}
  .g-wait .pip,.g-wait span{color:var(--wait)}     .g-wait .pip{background:var(--wait)}

  /* ---- dose card ---- */
  .card{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1px solid var(--line);
    border-radius:14px;padding:9px 10px 9px 14px;margin-bottom:7px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .card.g-bwait::before{background:var(--bwait)}
  .card.g-before::before{background:var(--before)}
  .card.g-with::before{background:var(--withm)}
  .card.g-wait::before{background:var(--wait)}
  .card.g-bwait{background:linear-gradient(90deg,color-mix(in srgb, var(--bwait) 8%, transparent),transparent 55%),var(--paper-2)}
  .card.g-before{background:linear-gradient(90deg,color-mix(in srgb, var(--before) 7%, transparent),transparent 55%),var(--paper-2)}
  .card.g-with{background:linear-gradient(90deg,color-mix(in srgb, var(--withm) 7%, transparent),transparent 55%),var(--paper-2)}
  .card.g-wait{background:linear-gradient(90deg,color-mix(in srgb, var(--wait) 8%, transparent),transparent 55%),var(--paper-2)}
  .card.done{background:color-mix(in srgb, var(--green) 8%, transparent);border-color:color-mix(in srgb, var(--green) 25%, transparent)}
  .card.done::before{background:var(--green)}

  .body{flex:1;min-width:0}
  .name{display:flex;align-items:center;font-weight:700;font-size:16.5px;letter-spacing:-.01em;word-break:break-word}
  .amt{display:inline-grid;place-items:center;text-decoration:none;min-width:24px;height:24px;padding:0 7px;
    font-size:13px;font-weight:700;color:var(--green);background:color-mix(in srgb, var(--green) 13%, transparent);border-radius:99px;
    margin-left:9px;white-space:nowrap;vertical-align:middle}
  .amt:empty{display:none}
  .card.done .name{text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--green) 50%, transparent);opacity:.6}
  .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:color-mix(in srgb, var(--ink) 7%, transparent);color:var(--ink-soft);white-space:nowrap}
  .tag.dose{background:color-mix(in srgb, var(--green) 11%, transparent);color:var(--green)}
  .tag.course{background:color-mix(in srgb, var(--ink) 9%, transparent);color:var(--ink);font-weight:700}
  .tag.day{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
  .tag.dep{background:color-mix(in srgb, var(--wait) 14%, transparent);color:var(--dep-ink)}
  .note{font-size:12px;color:var(--clay);margin-top:6px;font-style:italic;line-height:1.35}

  /* simple view — the checklist keeps only the name and the amount */
  #day .card .meta,
  #day .card .note,
  #day .card .track{display:none}
  body.detailed #day .card .meta{display:flex}
  body.detailed #day .card .note{display:block}
  body.detailed #day .card .track{display:block}
  .track{height:3px;border-radius:99px;background:color-mix(in srgb, var(--ink) 10%, transparent);margin-top:8px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--green-dim);border-radius:99px}

  .check{flex:0 0 auto;align-self:center;width:40px;height:40px;border-radius:50%;
    border:2px solid color-mix(in srgb, var(--ink) 22%, transparent);background:transparent;cursor:pointer;display:grid;place-items:center;
    transition:transform .18s ease,background .18s ease,border-color .18s ease}
  .check:active{transform:scale(.9)}
  .check svg{width:19px;height:19px;stroke:color-mix(in srgb, var(--ink) 25%, transparent);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .18s}
  .card.done .check{background:var(--green);border-color:var(--green)}
  .card.done .check svg{stroke:var(--on-accent);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.4)}to{transform:none}}

  /* ---- setup rows ---- */
  .sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
  .sec-head h2{font-family:"Fraunces",serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0}
  .sec-head .rule{flex:1;height:1px;background:var(--line)}
  .sec-head .count{font-size:12px;color:var(--ink-soft)}
  .med-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper-2);
    border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:transform .15s ease}
  .med-row.g-bwait{border-left-color:var(--bwait)}
  .med-row.g-before{border-left-color:var(--before)}
  .med-row.g-with{border-left-color:var(--withm)}
  .med-row.g-wait{border-left-color:var(--wait)}
  .med-row:active{transform:scale(.99)}
  .med-row .name{font-size:15.5px}
  .med-row.dim{opacity:.55}
  .chev{color:var(--green-dim);font-size:20px;line-height:1}

  .btn.trip{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);margin:0 0 8px}
  .pack{display:flex;align-items:center;gap:14px;background:var(--paper-2);border:1px solid var(--line);
    border-left:5px solid var(--green-dim);border-radius:14px;padding:12px 14px;margin-bottom:8px;
    animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
  .pack .qty{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:600;line-height:1;min-width:44px;text-align:right;color:var(--green)}
  .pack .qty small{display:block;font-family:"Karla",sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);margin-top:4px;text-align:right}
  .pack .who{flex:1;min-width:0}
  .pack .who b{font-size:15.5px;font-weight:700;display:block;word-break:break-word}
  .pack .who span{font-size:12px;color:var(--ink-soft)}
  .pack.partial{border-left-color:var(--ochre)}
  .pack.partial .who span{color:var(--ochre)}
  .totals{padding:14px 16px;border:1px dashed var(--line);border-radius:14px;margin-bottom:14px;
    font-size:14px;font-weight:700;color:var(--ink);line-height:1.6}
  .totals em{font-style:normal;color:var(--ink-soft);font-weight:600;font-size:12px;display:block;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
  .empty{padding:16px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:14px;font-size:13.5px;text-align:center;margin-top:8px}

  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;
    background:var(--green);color:var(--on-accent);border:none;font-family:"Karla",sans-serif;font-weight:700;font-size:15px;
    padding:15px 30px;border-radius:99px;cursor:pointer;box-shadow:0 10px 26px -8px rgba(30,42,36,.55);transition:transform .18s ease}
  .fab:active{transform:translateX(-50%) scale(.96)}

  .scrim{position:fixed;inset:0;background:rgba(30,42,36,.45);backdrop-filter:blur(3px);z-index:30;opacity:0;pointer-events:none;transition:opacity .28s ease}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;top:50%;z-index:31;background:var(--paper-2);border-radius:22px;
    padding:18px 18px 20px;width:calc(100% - 28px);max-width:440px;max-height:88dvh;overflow-y:auto;
    scrollbar-width:none;-ms-overflow-style:none;
    transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.9,.25,1),opacity .2s ease;
    box-shadow:0 30px 70px -25px rgba(30,42,36,.6), 0 0 0 1px var(--line)}
  .sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .sheet::-webkit-scrollbar{width:0;height:0;display:none}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
  .sheet h3{font-family:"Fraunces",serif;font-size:22px;font-weight:600;margin:0}
  .x{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);font-family:inherit;font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center}

  label{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin:0 0 6px}
  select{width:100%;font-family:inherit;font-size:15.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:11px 32px 11px 13px;outline:none;-webkit-appearance:none;appearance:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 18px) calc(50% + 2px),calc(100% - 13px) calc(50% + 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,93,75,.14)}
  input[type=text],input[type=number],input[type=date]{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
  /* iOS date inputs ignore width:100% in flex and overflow their frame without this */
  input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px}
  input:disabled{opacity:.5;background:color-mix(in srgb, var(--ink) 5%, transparent)}
  input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,93,75,.14)}
  .field{margin-bottom:14px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}

  .seg{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{flex:1;font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 4px;border:none;border-radius:9px;
    background:transparent;color:var(--ink-soft);cursor:pointer;transition:background .2s,color .2s}
  .seg button.on{background:var(--green);color:var(--on-accent)}
  .seg.meals button.on{background:var(--ochre);color:var(--on-accent)}
  .seg.rel button[data-v=before].on{background:var(--before);color:var(--on-accent)}
  .seg.rel.gapped button[data-v=before].on{background:var(--bwait)}
  .seg.rel button[data-v=with].on{background:var(--withm);color:var(--on-accent)}
  .seg.rel button[data-v=after].on{background:var(--clay);color:var(--on-accent)}

  .gap-opts{display:flex;gap:6px;margin-top:8px}
  .gap-opts button{flex:1;font-family:inherit;font-size:13px;font-weight:600;padding:9px 4px;border-radius:99px;cursor:pointer;white-space:nowrap;
    background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);transition:all .18s}
  .gap-opts button.on{background:color-mix(in srgb, var(--wait) 16%, transparent);border-color:color-mix(in srgb, var(--wait) 50%, transparent);color:var(--dep-ink)}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:7px}

  .btn{width:100%;font-family:inherit;font-weight:700;font-size:15.5px;padding:13px;border-radius:13px;border:none;cursor:pointer;margin-top:4px;transition:transform .15s ease}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--green);color:var(--on-accent)}
  .btn.cancel{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);margin-top:8px}
  .btn.ghost{background:transparent;color:var(--clay);border:1px solid color-mix(in srgb, var(--clay) 40%, transparent);margin-top:8px}
  .btn.reset{background:transparent;color:var(--ink-soft);border:1px dashed var(--line);margin-top:20px;font-size:14px}
  .sync-code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-2);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .sync-code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px;letter-spacing:.03em;word-break:break-all}
  .sync-code span{font-size:12px;color:var(--ink-soft);display:block;margin-top:3px}
  .btn-mini{flex:0 0 auto;font-family:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}

  /* ---- history ---- */
  .hday{background:var(--paper-2);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;
    padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadow);cursor:pointer;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
  .hday.full{border-left-color:var(--green)}
  .hday.part{border-left-color:var(--ochre)}
  .hday.miss{border-left-color:var(--clay)}
  .hday.idle{opacity:.55;cursor:default}
  .hday.today{border-color:color-mix(in srgb, var(--green) 35%, transparent)}
  .hd-top{display:flex;align-items:center;gap:10px}
  .hd-top b{font-size:15px;font-weight:700;flex:1;min-width:0}
  .hd-count{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .hday.full .hd-count{color:var(--green);font-weight:700}
  .hd-bar{height:3px;border-radius:99px;background:color-mix(in srgb, var(--ink) 10%, transparent);margin-top:9px;overflow:hidden}
  .hd-bar i{display:block;height:100%;border-radius:99px;background:var(--green-dim)}
  .hday.full .hd-bar i{background:var(--green)}
  .hday.miss .hd-bar i{background:var(--clay)}
  .hd-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .hday.open .hd-detail{display:block}
  .hd-ok{font-size:13px;color:var(--green);font-weight:700}
  .hd-miss{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
  .hd-med{font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);background:none;border:none;padding:0;
    cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;
    text-decoration-color:color-mix(in srgb, var(--ink) 30%, transparent);word-break:break-word}
  .hd-meal{flex:0 0 auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;
    background:color-mix(in srgb, var(--ink) 7%, transparent);color:var(--ink-soft)}
  .hd-slots{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .hd-slot{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .hd-slot.ok{background:color-mix(in srgb, var(--green) 13%, transparent);color:var(--green)}
  .hd-slot.no{background:color-mix(in srgb, var(--clay) 13%, transparent);color:var(--clay)}
  .hd-cap{text-align:center;font-size:12px;color:var(--ink-soft);margin:14px 0 4px;opacity:.8}

  /* ---- care calendar ---- */
  .icon-btn{position:relative}
  .care-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--clay);
    display:none;box-shadow:0 0 0 2px var(--paper-2)}
  .care-note{display:flex;align-items:center;gap:10px;width:100%;font-family:inherit;text-align:left;cursor:pointer;
    background:color-mix(in srgb, var(--clay) 9%, transparent);border:1px solid color-mix(in srgb, var(--clay) 30%, transparent);
    border-left:5px solid var(--clay);border-radius:14px;padding:11px 14px;margin:2px 0 12px;color:var(--ink)}
  .care-note b{flex:1;font-size:13.5px;font-weight:700}
  .care-note .chev{color:var(--clay)}
  .cal-wrap{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:14px;
    box-shadow:var(--shadow);margin-bottom:6px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-family:"Fraunces",serif;font-size:17px;font-weight:600}
  .cal-nav{display:flex;gap:6px}
  .cal-nav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);font-family:inherit;font-size:15px;cursor:pointer;display:grid;place-items:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-dow{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;padding:4px 0}
  .cal-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13.5px;font-weight:600;color:var(--ink);border-radius:10px;cursor:pointer}
  .cal-day.out{opacity:.28;font-weight:400;cursor:default}
  .cal-day.sel{background:color-mix(in srgb, var(--green) 18%, transparent)}
  .cal-day.today{background:var(--green);color:var(--on-accent)}
  .cal-dots{display:flex;gap:2.5px;margin-top:2px;height:5px}
  .cal-dots i{width:5px;height:5px;border-radius:50%}
  .dk-visit{background:var(--green)}
  .dk-test{background:var(--bwait)}
  .dk-end{background:var(--ochre)}
  .dk-book{background:var(--wait)}
  .cal-legend{display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:11px;color:var(--ink-soft);font-weight:600}
  .cal-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
  .ag-item{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1px solid var(--line);
    border-left:5px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadow)}
  .ag-item.visit{border-left-color:var(--green)}
  .ag-item.test{border-left-color:var(--bwait)}
  .ag-item.book{border-left-color:var(--wait)}
  .ag-item.end{border-left-color:var(--ochre);opacity:.85}
  .ag-when{min-width:46px;text-align:center;flex:0 0 auto}
  .ag-when b{font-family:"Fraunces",serif;font-size:20px;font-weight:600;display:block;line-height:1}
  .ag-when span{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .ag-body{flex:1;min-width:0;cursor:pointer}
  .ag-item.end .ag-body{cursor:default}
  .ag-body b{font-size:15px;font-weight:700;display:block;word-break:break-word}
  .ag-sub{font-size:12px;color:var(--ink-soft);display:block}
  .ag-kind{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:block}
  .ag-item.visit .ag-kind{color:var(--green)}
  .ag-item.test .ag-kind{color:var(--bwait)}
  .ag-item.book .ag-kind{color:var(--dep-ink)}
  .ag-item.end .ag-kind{color:var(--ochre)}
  .ag-item.overdue .ag-kind{color:var(--clay)}
  .ag-check{flex:0 0 auto;width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:2px solid color-mix(in srgb, var(--ink) 22%, transparent);background:transparent;display:grid;place-items:center}
  .ag-check svg{width:15px;height:15px;stroke:color-mix(in srgb, var(--ink) 25%, transparent);
    stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ag-item.done .ag-check{background:var(--green);border-color:var(--green)}
  .ag-item.done .ag-check svg{stroke:var(--on-accent)}
  .ag-item.done .ag-body b{text-decoration:line-through;opacity:.6}
  .vt-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .vt-row input[type=text]{flex:1;min-width:0}
  .vt-row input[type=number]{width:74px;flex:0 0 auto}
  .vt-row .x{width:30px;height:30px;flex:0 0 auto;font-size:17px}
  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:30px;opacity:.75}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="tb-left">
      <p class="eyebrow" id="eyebrow">Daily doses</p>
      <h1 id="title">Today's <em>meds</em></h1>
    </div>
    <div class="tb-right">
      <div class="icons">
        <button class="icon-btn" id="mode" aria-label="Switch to dark theme"></button>
        <button class="icon-btn" id="calBtn" aria-label="Care calendar"></button>
        <button class="icon-btn" id="eye" aria-label="Show details"></button>
        <button class="icon-btn" id="gear" aria-label="Configuration"></button>
      </div>
      <p class="date" id="date"></p>
    </div>
  </div>
</header>

<div class="filters" id="filters">
  <button data-v="breakfast"><span class="dot breakfast"></span>Breakfast<span class="badge"></span></button>
  <button data-v="lunch"><span class="dot lunch"></span>Lunch<span class="badge"></span></button>
  <button data-v="dinner"><span class="dot dinner"></span>Dinner<span class="badge"></span></button>
</div>

<div class="view on" id="viewToday">
  <button class="care-note" id="careNote" style="display:none">
    <b></b><span class="chev">›</span>
  </button>
  <div id="day"></div>
</div>

<div class="view" id="viewSetup">
  <button class="btn trip" id="histBtn">History — how you've been doing</button>
  <button class="btn trip" id="calSetupBtn">Care calendar — visits &amp; tests</button>
  <button class="btn trip" id="tripBtn">Travel calculator — what to pack</button>
  <div id="setup"></div>
  <div class="sec-head"><h2>Sync</h2><span class="rule"></span></div>
  <div id="syncBox"></div>
  <button class="btn reset" id="reset">Reset to the original prescription</button>
</div>

<div class="view" id="viewTrip">
  <div class="field">
    <div class="row">
      <div>
        <label for="tStart">Leaving on</label>
        <input type="date" id="tStart">
      </div>
      <div>
        <label for="tDays">How many days</label>
        <input type="number" id="tDays" min="1" step="1" value="7">
      </div>
    </div>
  </div>
  <div id="tripOut"></div>
</div>

<div class="view" id="viewHist">
  <div id="hist"></div>
</div>

<div class="view" id="viewCal">
  <div id="cal"></div>
</div>

<footer>Saved on this device · tap any medication to edit</footer>

<button class="fab" id="addBtn" style="display:none">+ Add medication</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h3 id="sheetTitle">Add medication</h3>
    <button class="x" id="closeX" aria-label="Close">&times;</button>
  </div>

  <div class="field">
    <label for="fName">Medication name</label>
    <input type="text" id="fName" placeholder="e.g. Amoxicillin" autocomplete="off">
  </div>

  <div class="field">
    <label for="fDose">Amount per dose</label>
    <input type="text" id="fDose" placeholder="e.g. 1 tablet · 2 gummies" autocomplete="off">
  </div>

  <div class="field">
    <label>Take it with which meals?</label>
    <div class="seg meals" id="segMeals">
      <button data-v="breakfast">Breakfast</button>
      <button data-v="lunch">Lunch</button>
      <button data-v="dinner">Dinner</button>
    </div>
  </div>

  <div class="field">
    <label>Relative to the meal</label>
    <div class="seg rel" id="segRel">
      <button data-v="before">Before</button>
      <button data-v="with">With</button>
      <button data-v="after">After</button>
    </div>
    <div class="gap-opts" id="gapOpts">
      <button data-v="0">None</button>
      <button data-v="30">30 min</button>
      <button data-v="60">1 hr</button>
      <button data-v="120">2 hrs</button>
    </div>
  </div>

  <div class="field">
    <label for="fAfter">Starts after another medication finishes</label>
    <select id="fAfter"></select>
    <p class="hint" id="depHint" style="display:none"></p>
  </div>

  <div class="field">
    <div class="row">
      <div>
        <label for="fStart">Start date</label>
        <input type="date" id="fStart">
      </div>
      <div>
        <label for="fDays">For how many days</label>
        <input type="number" id="fDays" min="1" step="1" placeholder="ongoing">
      </div>
    </div>
    <p class="hint">Leave the days empty if you take it with no end date.</p>
  </div>

  <div class="field">
    <label for="fCourse">Course / tag</label>
    <input type="text" id="fCourse" placeholder="e.g. جرثومة · هضم · قولون" autocomplete="off">
  </div>

  <div class="field">
    <label for="fNote">Note</label>
    <input type="text" id="fNote" placeholder="optional" autocomplete="off">
  </div>

  <button class="btn primary" id="save">Save medication</button>
  <button class="btn cancel" id="cancel">Cancel</button>
  <button class="btn ghost" id="del" style="display:none">Delete this medication</button>
</div>

<div class="sheet" id="vsheet">
  <div class="sheet-head">
    <h3 id="vsheetTitle">Add doctor visit</h3>
    <button class="x" id="vcloseX" aria-label="Close">&times;</button>
  </div>

  <div class="field">
    <label for="vName">Visit</label>
    <input type="text" id="vName" placeholder="e.g. Dr. Ahmed — follow-up" autocomplete="off">
  </div>

  <div class="field">
    <label>When</label>
    <div class="seg" id="vAnchorSeg">
      <button data-v="date">On a date</button>
      <button data-v="after">After a course</button>
    </div>
  </div>

  <div class="field" id="vDateField">
    <label for="vDate">Date</label>
    <input type="date" id="vDate">
  </div>

  <div class="field" id="vAfterField" style="display:none">
    <div class="row">
      <div>
        <label for="vAfter">Course</label>
        <select id="vAfter"></select>
      </div>
      <div>
        <label for="vOffset">Days after it ends</label>
        <input type="number" id="vOffset" min="0" max="30" step="1" value="1">
      </div>
    </div>
    <p class="hint" id="vHint"></p>
  </div>

  <div class="field">
    <label for="vBook">Booking call — days before the visit</label>
    <input type="number" id="vBook" min="0" max="60" step="1" placeholder="no reminder">
    <p class="hint">You'll be reminded to call the doctor and book this many days ahead. Leave empty for no reminder.</p>
  </div>

  <div class="field">
    <label>Tests to do before</label>
    <div id="vTests"></div>
    <button class="btn cancel" id="vAddTest" style="margin-top:6px">+ Add a test</button>
  </div>

  <div class="field">
    <label for="vNote">Note</label>
    <input type="text" id="vNote" placeholder="optional" autocomplete="off">
  </div>

  <button class="btn primary" id="vSave">Save visit</button>
  <button class="btn cancel" id="vCancel">Cancel</button>
  <button class="btn ghost" id="vDel" style="display:none">Delete this visit</button>
</div>

<script>
/* ---------------- storage ---------------- */
const MEM = {};
const store = {
  async get(k){
    if (window.storage && window.storage.get){
      try { const r = await window.storage.get(k, false); if (r && r.value != null) return r.value; } catch(e){}
    }
    try { const v = localStorage.getItem(k); if (v != null) return v; } catch(e){}
    return MEM[k] ?? null;
  },
  async set(k, v){
    MEM[k] = v;
    if (window.storage && window.storage.set){ try { await window.storage.set(k, v, false); } catch(e){} }
    try { localStorage.setItem(k, v); } catch(e){}
  }
};
const K_MEDS='meds:v3', K_LOG='medlog:v4', K_UI='medui:v1', K_SYNC='medsync:v1', K_CARE='care:v1';
const MEALS = [
  { id:'breakfast', label:'Breakfast' },
  { id:'lunch',     label:'Lunch' },
  { id:'dinner',    label:'Dinner' }
];
/* timing buckets — the colour language of the whole app */
const gapWord = g => g >= 60 && g % 60 === 0
  ? (g/60) + (g === 60 ? ' hour' : ' hours')
  : g + ' minutes';
/* each heading carries the timing, so the cards don't have to */
const BUCKETS = [
  { id:'g-bwait',  test:m => m.rel === 'before' && m.gap > 0,
    label:g => gapWord(g[0].gap) + ' before the meal' },
  { id:'g-before', test:m => m.rel === 'before' && !m.gap,
    label:() => 'Just before the meal' },
  { id:'g-with',   test:m => m.rel === 'with' || (m.rel === 'after' && !m.gap),
    label:g => g.every(m => m.rel === 'after') ? 'Right after the meal'
             : (g.every(m => m.rel === 'with') ? 'With the meal' : 'With / right after') },
  { id:'g-wait',   test:m => m.rel === 'after' && m.gap > 0,
    label:g => gapWord(g[0].gap) + ' after the meal' }
];
const bucketOf = m => (BUCKETS.find(b => b.test(m)) || BUCKETS[2]).id;

/* ---------------- dates ---------------- */
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey = () => iso(new Date());
const plusDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
const dayDiff = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
/* a medication can start the day after another one finishes — resolved up the chain */
function effStart(m, seen){
  seen = seen || {};
  if (m.after && !seen[m.id]){
    seen[m.id] = 1;
    const dep = meds.find(x => x.id === m.after);
    if (dep && dep.days){
      const d = new Date(effStart(dep, seen) + 'T00:00:00');
      d.setDate(d.getDate() + dep.days);
      return iso(d);
    }
  }
  return m.start || todayKey();
}
const depName = m => { const d = m.after && meds.find(x => x.id === m.after); return d ? d.name : ''; };
const dayIndex = m => dayDiff(effStart(m), todayKey()) + 1;
const isActive   = m => { const d = dayIndex(m); return d >= 1 && (!m.days || d <= m.days); };
const isFuture   = m => dayIndex(m) < 1;
const isFinished = m => !!m.days && dayIndex(m) > m.days;

/* ---------------- seed ---------------- */
const SEED = [
  { name:'Trigastrocare',       dose:'1 tab',    meals:['breakfast','lunch','dinner'], rel:'after',  gap:0,   days:10, off:0,  course:'جرثومة' },
  { name:'Lanex',               dose:'1 tab',    meals:['lunch'],                      rel:'before', gap:30,  days:30, off:0,  course:'جرثومة' },
  { name:'Actimar',             dose:'1 tab',    meals:['breakfast','lunch'],          rel:'after',  gap:60,  days:30, off:0,  course:'جرثومة' },
  { name:'Venigalight gummies', dose:'2 gummies',meals:['breakfast','lunch'],          rel:'before', gap:0,   days:30, off:0,  course:'هضم' },
  { name:'Jomogestive',         dose:'1 tab',    meals:['breakfast','lunch'],          rel:'after',  gap:0,   days:30, off:0,  course:'هضم' },
  { name:'Optadrol D3+K2',      dose:'1 tab',    meals:['lunch'],                      rel:'after',  gap:0,   days:30, off:0,  course:'هضم' },
  { name:'Tweetocalce',         dose:'2 tabs',   meals:['dinner'],                     rel:'after',  gap:0,   days:30, off:0,  course:'هضم' },
  { name:'Bmelt',               dose:'1 tab',    meals:['breakfast'],                  rel:'after',  gap:0,   days:30, off:0,  course:'هضم' },
  { name:'Fagellat Forte',      dose:'1 tab',    meals:['breakfast','lunch'],          rel:'after',  gap:120, days:10, off:10, course:'قولون', after:'seed0' },
  { name:'معدة الأعشاب',         dose:'½ tsp',    meals:['lunch'],                      rel:'after',  gap:60,  days:30, off:10, course:'قولون', after:'seed0' },
  { name:'Spirulina',           dose:'2 tabs',   meals:['breakfast'],                  rel:'before', gap:0,   days:30, off:20, course:'', note:'Needs doctor confirmation' },
  { name:'Declopro',            dose:'1 tab',    meals:['breakfast'],                  rel:'after',  gap:0,   days:10, off:0,  course:'' },
  { name:'Relaxon',             dose:'1 tab',    meals:['dinner'],                     rel:'after',  gap:0,   days:10, off:0,  course:'' }
];
const seedMeds = () => SEED.map((s,i) => ({
  id:'seed'+i, name:s.name, dose:s.dose, meals:s.meals, rel:s.rel, gap:s.gap,
  days:s.days, start:plusDays(s.off), course:s.course||'', note:s.note||'', after:s.after||null
}));

/* ---------------- state ---------------- */
let meds = [], log = {}, ui = { tab:'today', meal:'breakfast', detail:false, theme:'light' }, draft = null;
let sync = { code:null, medsTs:null, careTs:null, last:null, err:null };   /* last/err are per-session, not stored */
let care = [];   /* doctor visits, each with embedded tests — see specs/002-care-calendar */

async function load(){
  const raw = await store.get(K_MEDS);
  if (raw == null){ meds = seedMeds(); await saveMeds(); }
  else { try { meds = JSON.parse(raw); } catch(e){ meds = []; } }
  try { log = JSON.parse(await store.get(K_LOG) || 'null'); } catch(e){ log = null; }
  if (!log){
    /* first run on v4 — carry over a v3 log (plain arrays of keys) if one exists */
    log = {};
    try {
      const old = JSON.parse(await store.get('medlog:v3') || '{}');
      const t = new Date().toISOString();
      Object.keys(old).forEach(d => {
        log[d] = {};
        (old[d] || []).forEach(key => log[d][key] = { t, on:true });
      });
    } catch(e){}
  }
  try { ui = Object.assign(ui, JSON.parse(await store.get(K_UI) || '{}')); } catch(e){}
  try { Object.assign(sync, JSON.parse(await store.get(K_SYNC) || '{}')); } catch(e){}
  try { care = JSON.parse(await store.get(K_CARE) || '[]'); } catch(e){ care = []; }
  prune();
  /* open on the meal that's closest to now */
  const h = new Date().getHours();
  ui.meal = h < 11 ? 'breakfast' : (h < 17 ? 'lunch' : 'dinner');
  paintFilters(); paintDetail(); paintTheme(); setTab('today'); render();   /* always open on the checklist */
  paintSync(); pullSync();
}
function prune(){ const k = Object.keys(log).sort(); while (k.length > 60) delete log[k.shift()]; }
async function saveMeds(){
  sync.medsTs = new Date().toISOString(); saveSyncMeta();
  await store.set(K_MEDS, JSON.stringify(meds)); pushSoon();
}
async function saveLog(){ prune(); await store.set(K_LOG, JSON.stringify(log)); pushSoon(); }
async function saveUI(){ await store.set(K_UI, JSON.stringify(ui)); }

/* ---------------- labels ---------------- */
function whenBig(m){
  if (m.rel === 'with' || !m.gap) return m.rel === 'with' ? 'With' : (m.rel === 'before' ? 'Before' : 'After');
  const g = Number(m.gap);
  if (g >= 60 && g % 60 === 0) return (g/60) + (g === 60 ? ' hour' : ' hours');
  return g + ' min';
}
/* the group heading already says which side of the meal we're on */
const whenSmall = m => (m.rel === 'with' || !m.gap) ? '' : (m.rel === 'before' ? 'before' : 'after');
function relLabel(m){
  if (m.rel === 'with') return 'With food';
  const g = Number(m.gap) || 0;
  const w = m.rel === 'before' ? 'before food' : 'after food';
  if (!g) return m.rel === 'before' ? 'Before food' : 'After food';
  if (g >= 60 && g % 60 === 0) return (g/60) + (g === 60 ? ' hr ' : ' hrs ') + w;
  return g + ' min ' + w;
}
function dayLabel(m){
  if (!m.days) return 'Ongoing';
  const d = dayIndex(m);
  if (d < 1) return 'Starts in ' + (1-d) + (1-d === 1 ? ' day' : ' days');
  if (d > m.days) return 'Finished';
  return 'Day ' + d + ' of ' + m.days + ' · ' + (m.days - d) + ' left';
}
function sortInGroup(a,b){
  if (a.rel === 'before' && b.rel === 'before') return (b.gap||0) - (a.gap||0);
  return (a.gap||0) - (b.gap||0);
}

/* ---------------- shared bits ---------------- */
function metaHTML(m){
  return '<div class="meta">' +
    '<span class="tag">' + relLabel(m) + '</span>' +
    (m.course ? '<span class="tag course"></span>' : '') +
    (depName(m) ? '<span class="tag dep"></span>' : '') +
    '<span class="tag day">' + dayLabel(m) + '</span>' +
  '</div>';
}
/* "2 gummies" → "2" for the checklist; the full wording stays in the setup list */
const amtShort = d => { const m = (d||'').match(/^\s*([\d.,]+|[½¼¾⅓⅔⅛])/); return m ? m[1] : (d||''); };
function fillMeta(el, m, full){
  el.querySelector('.n').textContent = m.name;
  el.querySelector('.amt').textContent = full ? (m.dose || '') : amtShort(m.dose);
  if (m.course) el.querySelector('.tag.course').textContent = m.course;
  if (depName(m)) el.querySelector('.tag.dep').textContent = 'after ' + depName(m);
  if (m.note && el.querySelector('.note')) el.querySelector('.note').textContent = m.note;
}

/* ---------------- checklist view ---------------- */
function render(){
  const d = new Date();
  document.getElementById('date').textContent = d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'});

  const active = meds.filter(isActive);
  const taken = takenOn(todayKey());

  const dayEl = document.getElementById('day');
  dayEl.innerHTML = '';
  let anim = 0;

  const meal = MEALS.find(x => x.id === ui.meal) || MEALS[0];
  const list = active.filter(m => (m.meals||[]).includes(meal.id));

  if (!list.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Nothing to take with ' + meal.label.toLowerCase() + ' today.';
    dayEl.appendChild(e);
  } else {
    BUCKETS.forEach(bk => {
      const inBucket = list.filter(m => bucketOf(m) === bk.id);
      if (!inBucket.length) return;
      const gaps = [...new Set(inBucket.map(m => m.gap || 0))]
        .sort((a,b) => bk.id === 'g-bwait' ? b - a : a - b);
      gaps.forEach(g => {
        const group = inBucket.filter(m => (m.gap||0) === g);
        const gh = document.createElement('div');
        gh.className = 'grp-head ' + bk.id;
        gh.innerHTML = '<i class="pip"></i><span>' + bk.label(group) + '</span>';
        dayEl.appendChild(gh);
        group.forEach(m => dayEl.appendChild(doseCard(m, meal.id, taken, anim++)));
      });
    });
  }

  updateCounts();
  updateCareNote();
  renderSetup();
  if (ui.tab === 'history') renderHistory();   /* sync pulls land here too */
  if (ui.tab === 'cal') renderCal();
}

/* recomputes the progress bar and the per-meal counters without touching the cards */
function updateCounts(){
  const active = meds.filter(isActive);
  const taken = takenOn(todayKey());
  const meal = MEALS.find(x => x.id === ui.meal) || MEALS[0];

  MEALS.forEach(x => {
    const btn = document.querySelector('#filters button[data-v="' + x.id + '"]');
    if (!btn) return;
    const l = active.filter(m => (m.meals||[]).includes(x.id));
    const left = l.filter(m => !taken.includes(m.id + '|' + x.id)).length;
    const b = btn.querySelector('.badge');
    b.textContent = !l.length ? '' : (left ? left : '✓');
    b.className = 'badge' + (l.length && !left ? ' clear' : '');
  });
}

function doseCard(m, mealId, taken, i){
  const key = m.id + '|' + mealId;
  const isDone = taken.includes(key);
  const pct = m.days ? Math.min(100, Math.max(0, dayIndex(m)/m.days*100)) : 0;
  const el = document.createElement('div');
  el.className = 'card ' + bucketOf(m) + (isDone ? ' done' : '');
  el.style.animationDelay = (i*30) + 'ms';
  el.innerHTML =
    '<div class="body"><div class="name"><span class="n"></span><span class="amt"></span></div>' + metaHTML(m) +
      (m.note ? '<div class="note"></div>' : '') +
      (m.days ? '<div class="track"><i style="width:' + pct + '%"></i></div>' : '') +
    '</div>' +
    '<button class="check" aria-label="Mark as taken"><svg viewBox="0 0 24 24"><polyline points="4,12.5 9.5,18 20,6.5"/></svg></button>';
  fillMeta(el, m);
  el.querySelector('.check').onclick = () => toggle(key, el);
  return el;
}

/* the log keeps every tick AND untick with its time, so devices can merge:
   per entry, the newest write wins — an untick beats the older tick it removes */
const takenOn = d => { const day = log[d] || {}; return Object.keys(day).filter(k => day[k] && day[k].on); };

/* silent tick: flips this one card, refreshes the counters, saves in the background.
   No re-render, so nothing re-animates and the page doesn't jump. */
function toggle(key, el){
  const k = todayKey();
  const day = log[k] = log[k] || {};
  const nowDone = !(day[key] && day[key].on);
  day[key] = { t: new Date().toISOString(), on: nowDone };
  if (el) el.classList.toggle('done', nowDone);
  updateCounts();
  saveLog();
}

/* ---------------- travel calculator ---------------- */
const FRACTIONS = { '½':0.5, '¼':0.25, '¾':0.75, '⅓':1/3, '⅔':2/3, '⅛':0.125 };
function amtNum(d){
  const m = (d||'').match(/^\s*([\d.,]+|[½¼¾⅓⅔⅛])/);
  if (!m) return 1;
  return FRACTIONS[m[1]] !== undefined ? FRACTIONS[m[1]] : (parseFloat(m[1].replace(',','.')) || 1);
}
function unitWord(d){
  const m = (d||'').match(/^\s*(?:[\d.,]+|[½¼¾⅓⅔⅛])\s*(.*)$/);
  const w = (m && m[1] ? m[1] : '').trim();
  return w || 'dose';
}
const plural = (n, w) => (n > 1 && !/s$/i.test(w)) ? w + 's' : w;
const tidy   = n => Math.round(n*100)/100;
const activeOn = (m, dstr) => { const d = dayDiff(effStart(m), dstr) + 1; return d >= 1 && (!m.days || d <= m.days); };

function renderTrip(){
  const out = document.getElementById('tripOut');
  const start = document.getElementById('tStart').value || todayKey();
  const n = Math.max(1, parseInt(document.getElementById('tDays').value, 10) || 1);

  const dates = [];
  for (let i = 0; i < n; i++){
    const d = new Date(start + 'T00:00:00');
    d.setDate(d.getDate() + i);
    dates.push(iso(d));
  }

  const rows = [], totals = {};
  meds.forEach(m => {
    const perDay = (m.meals||[]).length;
    if (!perDay) return;
    const days = dates.filter(x => activeOn(m, x)).length;
    if (!days) return;
    const units = days * perDay * amtNum(m.dose);
    const w = unitWord(m.dose);
    /* "tab" and "tabs" are the same unit — total under one key,
       and remember a real singular form for the label when we saw one */
    const key = w.toLowerCase().replace(/s$/, '');
    totals[key] = totals[key] || { n:0, word:key };
    totals[key].n += units;
    if (!/s$/i.test(w)) totals[key].word = w;
    rows.push({ m, days, perDay, units, w });
  });

  out.innerHTML = '';
  if (!rows.length){
    out.innerHTML = '<div class="empty">Nothing on your list runs during those days.</div>';
    return;
  }

  const sum = document.createElement('div');
  sum.className = 'totals';
  sum.innerHTML = '<em>Pack in total</em>' +
    Object.keys(totals).map(k => tidy(totals[k].n) + ' ' + plural(totals[k].n, totals[k].word)).join(' · ');
  out.appendChild(sum);

  rows.sort((a,b) => b.units - a.units).forEach((r, i) => {
    const partial = r.days < n;
    const el = document.createElement('div');
    el.className = 'pack' + (partial ? ' partial' : '');
    el.style.animationDelay = (i*30) + 'ms';
    el.innerHTML = '<div class="who"><b></b><span>' +
        r.perDay + '× a day · ' + (partial ? 'only ' + r.days + ' of the ' + n + ' days' : n + ' days') +
      '</span></div>' +
      '<div class="qty">' + tidy(r.units) + '<small>' + plural(r.units, r.w) + '</small></div>';
    el.querySelector('b').textContent = r.m.name;
    out.appendChild(el);
  });
}
document.getElementById('tStart').oninput = renderTrip;
document.getElementById('tDays').oninput  = renderTrip;
document.getElementById('tripBtn').onclick = () => {
  document.getElementById('tStart').value = document.getElementById('tStart').value || todayKey();
  setTab('trip'); renderTrip();
};

/* ---------------- history view ----------------
   Everything here is derived at render time from meds + log — no writes,
   no sync calls, no stored state. histBack / histMed are transient. */
let histBack = 'today', histMed = null;

function expectedOn(dstr){
  const out = [];
  meds.forEach(m => { if (activeOn(m, dstr)) (m.meals||[]).forEach(meal => out.push(m.id + '|' + meal)); });
  return out;
}
function daySummary(dstr){
  const expected = expectedOn(dstr);
  const on = takenOn(dstr);
  const taken = expected.filter(k => on.includes(k));
  const missed = expected.filter(k => !on.includes(k));
  const state = !expected.length ? 'idle' : (!taken.length ? 'miss' : (missed.length ? 'part' : 'full'));
  return { date:dstr, expected, taken, missed, state, isToday: dstr === todayKey() };
}
/* newest first; at least 14 days, then only while days still carry data or a schedule, capped at the 60-day log window */
function historyDays(){
  const days = [];
  for (let i = 0; i < 60; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const s = daySummary(iso(d));
    s.hasData = s.expected.length > 0 || !!(log[s.date] && Object.keys(log[s.date]).length);
    days.push(s);
  }
  let end = days.length;
  while (end > 14 && !days[end-1].hasData) end--;
  return days.slice(0, Math.max(14, end));
}
/* idle days pass through; today counts only when complete and never breaks the run */
function streakFrom(days){
  let n = 0;
  for (const s of days){
    if (s.state === 'idle') continue;
    if (s.isToday){ if (s.state === 'full') n++; continue; }
    if (s.state === 'full') n++; else break;
  }
  return n;
}
const histDate = dstr => new Date(dstr + 'T00:00:00').toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});

function renderHistory(){
  const el = document.getElementById('hist');
  el.innerHTML = '';
  if (histMed){ renderMedHistory(el); return; }

  const days = historyDays();
  const streak = streakFrom(days);
  const scheduled = days.filter(s => s.state !== 'idle');
  const expectedAll = scheduled.reduce((n,s) => n + s.expected.length, 0);
  const takenAll = scheduled.reduce((n,s) => n + s.taken.length, 0);

  const head = document.createElement('div');
  head.className = 'totals';
  head.innerHTML = '<em>Current streak</em>' +
    (streak ? streak + (streak === 1 ? ' day' : ' days') + ' of everything taken' : 'No streak yet — today is a fresh start') +
    (expectedAll ? '<em style="margin-top:10px">These ' + scheduled.length + ' days</em>' + takenAll + ' of ' + expectedAll + ' doses taken' : '');
  el.appendChild(head);

  days.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'hday ' + s.state + (s.isToday ? ' today' : '');
    row.style.animationDelay = (Math.min(i,20)*20) + 'ms';
    const pct = s.expected.length ? s.taken.length / s.expected.length * 100 : 0;
    row.innerHTML = '<div class="hd-top"><b></b><span class="hd-count"></span></div>' +
      (s.state === 'idle' ? '' : '<div class="hd-bar"><i style="width:' + pct + '%"></i></div><div class="hd-detail"></div>');
    row.querySelector('b').textContent = s.isToday ? 'Today' : histDate(s.date);
    row.querySelector('.hd-count').textContent = s.state === 'idle'
      ? 'nothing scheduled'
      : s.taken.length + ' of ' + s.expected.length + ' taken';
    if (s.state !== 'idle'){
      const det = row.querySelector('.hd-detail');
      if (!s.missed.length){
        det.innerHTML = '<span class="hd-ok">Everything taken</span>';
      } else {
        s.missed.forEach(k => {
          const id = k.split('|')[0], meal = k.split('|')[1];
          const m = meds.find(x => x.id === id);
          if (!m) return;
          const line = document.createElement('div');
          line.className = 'hd-miss';
          line.innerHTML = '<button class="hd-med"></button><span class="hd-meal"></span>';
          line.querySelector('.hd-med').textContent = m.name;
          line.querySelector('.hd-meal').textContent = (MEALS.find(x => x.id === meal) || {}).label || meal;
          line.querySelector('.hd-med').onclick = e => { e.stopPropagation(); histMed = id; renderHistory(); };
          det.appendChild(line);
        });
      }
      row.onclick = () => row.classList.toggle('open');
    }
    el.appendChild(row);
  });

  const cap = document.createElement('p');
  cap.className = 'hd-cap';
  cap.textContent = 'History keeps 60 days';
  el.appendChild(cap);
}

/* one medication's own record: a row per day inside its course window, a chip per meal slot */
function renderMedHistory(el){
  const m = meds.find(x => x.id === histMed);
  if (!m){ histMed = null; renderHistory(); return; }

  const back = document.createElement('button');
  back.className = 'btn cancel';
  back.style.marginTop = '0';
  back.textContent = '← All days';
  back.onclick = () => { histMed = null; renderHistory(); };
  el.appendChild(back);

  const head = document.createElement('div');
  head.className = 'totals';
  head.innerHTML = '<em></em><span></span>';
  head.querySelector('em').textContent = m.name;
  head.querySelector('span').textContent = (m.dose ? m.dose + ' · ' : '') + relLabel(m);
  el.appendChild(head);

  const days = historyDays().filter(s => activeOn(m, s.date));
  if (!days.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'No days in the last 60 fall inside this course.';
    el.appendChild(e);
    return;
  }
  days.forEach((s, i) => {
    const on = takenOn(s.date);
    const slots = (m.meals||[]).map(meal => ({
      label: (MEALS.find(x => x.id === meal) || {}).label || meal,
      ok: on.includes(m.id + '|' + meal)
    }));
    const allOk = slots.every(x => x.ok);
    const row = document.createElement('div');
    row.className = 'hday ' + (allOk ? 'full' : (slots.some(x => x.ok) ? 'part' : 'miss')) + (s.isToday ? ' today' : '');
    row.style.cursor = 'default';
    row.style.animationDelay = (Math.min(i,20)*20) + 'ms';
    row.innerHTML = '<div class="hd-top"><b></b><span class="hd-slots"></span></div>';
    row.querySelector('b').textContent = s.isToday ? 'Today' : histDate(s.date);
    const wrap = row.querySelector('.hd-slots');
    slots.forEach(x => {
      const c = document.createElement('span');
      c.className = 'hd-slot ' + (x.ok ? 'ok' : 'no');
      c.textContent = x.label + (x.ok ? ' ✓' : ' —');
      wrap.appendChild(c);
    });
    el.appendChild(row);
  });
}

/* ---------------- care calendar (specs/002-care-calendar) ----------------
   Visits anchor to a course end via effStart, tests anchor to their visit —
   all dates derived at render time. `care` is stored + synced (whole-list
   LWW on careTs); calBack/calMonth/calSel/vdraft are transient. */
let calBack = 'today', calMonth = null, calSel = null, vdraft = null;

const courseEnd = m => { const d = new Date(effStart(m)+'T00:00:00'); d.setDate(d.getDate() + (m.days||1) - 1); return iso(d); };
function visitDate(v){
  if (v.after){
    const m = meds.find(x => x.id === v.after);
    if (m && m.days){
      const d = new Date(courseEnd(m)+'T00:00:00'); d.setDate(d.getDate() + (v.offset||0)); return iso(d);
    }
  }
  return v.date || todayKey();
}
const testDate = (v, t) => { const d = new Date(visitDate(v)+'T00:00:00'); d.setDate(d.getDate() - (t.before||0)); return iso(d); };
const bookDate = v => { const d = new Date(visitDate(v)+'T00:00:00'); d.setDate(d.getDate() - (v.book.before||0)); return iso(d); };

async function saveCare(){
  const cutoff = plusDays(-60);
  care = care.filter(v => !(v.done && (v.tests||[]).every(t => t.done) && visitDate(v) < cutoff));
  sync.careTs = new Date().toISOString(); saveSyncMeta();
  await store.set(K_CARE, JSON.stringify(care)); pushSoon();
}

function offsetWord(v){
  const m = meds.find(x => x.id === v.after);
  if (!m) return '';
  return v.offset ? v.offset + (v.offset === 1 ? ' day' : ' days') + ' after ' + m.name + ' ends'
                  : 'when ' + m.name + ' ends';
}

/* every dated item: visits, their tests, and course endings (informational) */
function careItems(){
  const items = [];
  care.forEach(v => {
    items.push({ date: visitDate(v), kind:'visit', label: v.title,
      sub: v.after ? offsetWord(v) : (v.note || ''), done: !!v.done, vId: v.id });
    (v.tests||[]).forEach(t => items.push({ date: testDate(v, t), kind:'test', label: t.name,
      sub: (t.before ? t.before + (t.before === 1 ? ' day' : ' days') + ' before ' : 'day of ') + v.title,
      done: !!t.done, vId: v.id, tId: t.id }));
    if (v.book) items.push({ date: bookDate(v), kind:'book', label: v.title,
      sub: 'call to book, ' + (v.book.before ? v.book.before + (v.book.before === 1 ? ' day' : ' days') + ' ahead' : 'day of the visit'),
      done: !!v.book.done, vId: v.id, book: true });
  });
  meds.filter(m => m.days).forEach(m => items.push({ date: courseEnd(m), kind:'end',
    label: m.name + ' finishes', sub: m.days + '-day course', done:false, end:true }));
  return items.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

/* due today or overdue and not done — feeds the checklist banner and icon dot */
function careDue(){
  const today = todayKey();
  return careItems().filter(it => !it.end && !it.done && it.date <= today && it.date >= plusDays(-60));
}
function updateCareNote(){
  const note = document.getElementById('careNote');
  const due = careDue();
  document.getElementById('careDot').style.display = due.length ? 'block' : 'none';
  if (!due.length){ note.style.display = 'none'; return; }
  note.style.display = 'flex';
  const today = todayKey();
  const overdueN = due.filter(it => it.date < today).length;
  note.querySelector('b').textContent = due.length === 1
    ? (due[0].kind === 'test' ? 'Lab test' : due[0].kind === 'book' ? 'Call to book' : 'Doctor visit') +
      (due[0].date < today ? ' overdue' : ' today') + ' — ' + due[0].label
    : due.length + ' care items need attention' + (overdueN ? ' (' + overdueN + ' overdue)' : '');
}

function renderCal(){
  const el = document.getElementById('cal');
  el.innerHTML = '';
  const today = todayKey();
  if (!calMonth){ const d = new Date(); calMonth = { y: d.getFullYear(), m: d.getMonth() }; }
  const items = careItems();
  const byDate = {};
  items.forEach(it => (byDate[it.date] = byDate[it.date] || []).push(it));

  /* month grid — the week starts on Friday */
  const wrap = document.createElement('div');
  wrap.className = 'cal-wrap';
  const lead = (new Date(calMonth.y, calMonth.m, 1).getDay() - 5 + 7) % 7;
  const dim = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
  let cells = '';
  ['Fr','Sa','Su','Mo','Tu','We','Th'].forEach(d => cells += '<span class="cal-dow">' + d + '</span>');
  for (let i = 0; i < lead; i++)
    cells += '<span class="cal-day out">' + new Date(calMonth.y, calMonth.m, 1 - lead + i).getDate() + '</span>';
  for (let d = 1; d <= dim; d++){
    const ds = iso(new Date(calMonth.y, calMonth.m, d));
    const dots = [...new Set((byDate[ds] || []).map(x => x.kind))].slice(0,3)
      .map(k => '<i class="dk-' + k + '"></i>').join('');
    cells += '<span class="cal-day' + (ds === today ? ' today' : '') + (ds === calSel ? ' sel' : '') +
      '" data-d="' + ds + '">' + d + '<span class="cal-dots">' + dots + '</span></span>';
  }
  const tail = (7 - (lead + dim) % 7) % 7;
  for (let d = 1; d <= tail; d++) cells += '<span class="cal-day out">' + d + '</span>';
  const monthName = new Date(calMonth.y, calMonth.m, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});
  wrap.innerHTML = '<div class="cal-head"><b></b>' +
    '<div class="cal-nav"><button id="calPrev" aria-label="Previous month">‹</button><button id="calNext" aria-label="Next month">›</button></div></div>' +
    '<div class="cal-grid">' + cells + '</div>' +
    '<div class="cal-legend"><span><i class="dk-visit"></i>Visit</span><span><i class="dk-test"></i>Lab test</span><span><i class="dk-book"></i>Book</span><span><i class="dk-end"></i>Course ends</span></div>';
  wrap.querySelector('.cal-head b').textContent = monthName;
  el.appendChild(wrap);
  wrap.querySelector('#calPrev').onclick = () => { calMonth.m--; if (calMonth.m < 0){ calMonth.m = 11; calMonth.y--; } renderCal(); };
  wrap.querySelector('#calNext').onclick = () => { calMonth.m++; if (calMonth.m > 11){ calMonth.m = 0; calMonth.y++; } renderCal(); };
  wrap.querySelectorAll('.cal-day[data-d]').forEach(c => c.onclick = () => {
    calSel = calSel === c.dataset.d ? null : c.dataset.d; renderCal();
  });

  const addSection = title => {
    const h = document.createElement('div');
    h.className = 'sec-head';
    h.innerHTML = '<h2></h2><span class="rule"></span>';
    h.querySelector('h2').textContent = title;
    el.appendChild(h);
  };
  const addItem = it => {
    const row = document.createElement('div');
    row.className = 'ag-item ' + it.kind + (it.done ? ' done' : '');
    const d = new Date(it.date + 'T00:00:00');
    row.innerHTML = '<div class="ag-when"><b>' + d.getDate() + '</b><span>' +
        d.toLocaleDateString(undefined,{month:'short'}) + '</span></div>' +
      '<div class="ag-body"><span class="ag-kind"></span><b></b><span class="ag-sub"></span></div>' +
      (it.end ? '' : '<button class="ag-check" aria-label="Mark done"><svg viewBox="0 0 24 24"><polyline points="4,12.5 9.5,18 20,6.5"/></svg></button>');
    row.querySelector('.ag-kind').textContent =
      (it.kind === 'visit' ? 'Doctor visit' : it.kind === 'test' ? 'Lab test'
        : it.kind === 'book' ? 'Call to book' : 'Course ends') +
      (it.overdue ? ' · overdue' : '');
    if (it.overdue) row.classList.add('overdue');
    row.querySelector('.ag-body b').textContent = it.label;
    row.querySelector('.ag-sub').textContent = it.sub || '';
    if (!it.end){
      row.querySelector('.ag-check').onclick = async e => {
        e.stopPropagation();
        const v = care.find(x => x.id === it.vId); if (!v) return;
        if (it.book){ if (v.book) v.book.done = !v.book.done; }
        else if (it.tId){ const t = (v.tests||[]).find(x => x.id === it.tId); if (t) t.done = !t.done; }
        else v.done = !v.done;
        await saveCare(); renderCal(); updateCareNote();
      };
      row.querySelector('.ag-body').onclick = () => openVisitSheet(care.find(x => x.id === it.vId));
    }
    el.appendChild(row);
  };

  if (calSel){
    addSection(histDate(calSel));
    const sel = byDate[calSel] || [];
    if (!sel.length){
      const e2 = document.createElement('div'); e2.className = 'empty';
      e2.textContent = 'Nothing on this day.'; el.appendChild(e2);
    }
    sel.forEach(addItem);
  }

  const overdue = items.filter(it => !it.end && !it.done && it.date < today && it.date >= plusDays(-60))
    .map(it => ({ ...it, overdue: true }));
  const upcoming = items.filter(it => it.date >= today && it.date <= plusDays(120));
  addSection('Coming up');
  if (!overdue.length && !upcoming.length){
    const e2 = document.createElement('div'); e2.className = 'empty';
    e2.textContent = 'Nothing planned yet — add a doctor visit below.';
    el.appendChild(e2);
  } else {
    overdue.forEach(addItem);
    upcoming.forEach(addItem);
  }
}

/* ---------------- sync — Vercel function + Neon (see api/sync.js) ----------------
   Offline-first: this device's copy is what the app runs on; the server is a
   meeting point for devices holding the same code. Meds are last-write-wins on
   one timestamp for the whole list; the tick log merges per entry, newest write
   wins, which is why unticks carry their own timestamped record. */
let syncTimer = null;

function newSyncCode(){
  const A = 'abcdefghjkmnpqrstuvwxyz23456789';   /* no 0/O/1/l/i confusables */
  const b = crypto.getRandomValues(new Uint8Array(12));
  let s = ''; b.forEach(x => s += A[x % A.length]);
  return 'doses-' + s.slice(0,6) + '-' + s.slice(6);
}
async function saveSyncMeta(){ await store.set(K_SYNC, JSON.stringify({ code:sync.code, medsTs:sync.medsTs, careTs:sync.careTs })); }

function mergeLog(a, b){
  const out = {};
  [a, b].forEach(src => Object.keys(src || {}).forEach(d => {
    const day = out[d] = out[d] || {};
    const sd = src[d] || {};
    Object.keys(sd).forEach(key => {
      if (!day[key] || (sd[key].t || '') > (day[key].t || '')) day[key] = sd[key];
    });
  }));
  return out;
}

function pushSoon(){ if (!sync.code) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => { syncTimer = null; pushSync(); }, 1200); }

async function pushSync(){
  if (!sync.code) return;
  try {
    const r = await fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: sync.code, meds, log, medsUpdated: sync.medsTs, care, careUpdated: sync.careTs }) });
    if (r.status === 503) throw 'nodb';
    if (!r.ok) throw 'net';
    sync.last = new Date().toISOString(); sync.err = null;
  } catch(e){ sync.err = e === 'nodb' ? 'nodb' : 'net'; }
  paintSync();
}

async function pullSync(){
  if (!sync.code) return;
  if (syncTimer){ clearTimeout(syncTimer); syncTimer = null; await pushSync(); }
  try {
    const r = await fetch('/api/sync?code=' + encodeURIComponent(sync.code));
    if (r.status === 503) throw 'nodb';
    if (!r.ok) throw 'net';
    const row = await r.json();
    let changed = false, needPush = !row;
    if (row){
      const sTs = row.meds_updated || '';
      if (sTs > (sync.medsTs || '') && JSON.stringify(row.meds || []) !== JSON.stringify(meds)){
        meds = row.meds || []; sync.medsTs = sTs; changed = true;
        await store.set(K_MEDS, JSON.stringify(meds));   /* adopt without bumping the timestamp */
      } else if ((sync.medsTs || '') > sTs) needPush = true;
      const merged = mergeLog(log, row.log || {});
      if (JSON.stringify(merged) !== JSON.stringify(log)){
        log = merged; prune(); changed = true;
        await store.set(K_LOG, JSON.stringify(log));
      }
      if (JSON.stringify(log) !== JSON.stringify(row.log || {})) needPush = true;
      const cTs = row.care_updated || '';
      if (cTs > (sync.careTs || '') && JSON.stringify(row.care || []) !== JSON.stringify(care)){
        care = row.care || []; sync.careTs = cTs; changed = true;
        await store.set(K_CARE, JSON.stringify(care));   /* adopt without bumping the timestamp */
      } else if ((sync.careTs || '') > cTs) needPush = true;
    }
    sync.last = new Date().toISOString(); sync.err = null;
    await saveSyncMeta();
    if (needPush) await pushSync();
    if (changed) render();
  } catch(e){ sync.err = e === 'nodb' ? 'nodb' : 'net'; }
  paintSync();
}

function paintSync(){
  const el = document.getElementById('syncBox');
  if (!sync.code){
    el.innerHTML =
      '<p class="hint" style="margin:0 0 10px">Saved only on this device for now. Sync keeps a copy on the server and shares it with any device that has the code.</p>' +
      '<button class="btn trip" id="syncOn">Turn on sync — get a code</button>' +
      '<button class="btn cancel" id="syncJoin" style="margin-top:0">I already have a code</button>';
    document.getElementById('syncOn').onclick = async () => {
      sync.code = newSyncCode();
      sync.medsTs = sync.medsTs || new Date().toISOString();
      await saveSyncMeta(); paintSync(); pullSync();
    };
    document.getElementById('syncJoin').onclick = async () => {
      const c = (prompt('Enter the sync code from your other device') || '').trim().toLowerCase();
      if (!c) return;
      sync.code = c; sync.medsTs = null;   /* the other device's list wins */
      await saveSyncMeta(); paintSync(); pullSync();
    };
  } else {
    const status = sync.err === 'nodb' ? 'The deployment has no database linked yet'
      : sync.err ? "Can't reach the server — will retry"
      : sync.last ? 'Synced at ' + new Date(sync.last).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})
      : 'Connecting…';
    el.innerHTML =
      '<div class="sync-code"><div><b></b><span></span></div><button class="btn-mini" id="syncCopy">Copy</button></div>' +
      '<button class="btn ghost" id="syncOff" style="margin-top:0">Turn off sync on this device</button>';
    el.querySelector('b').textContent = sync.code;
    el.querySelector('span').textContent = status;
    document.getElementById('syncCopy').onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(sync.code) : Promise.reject())
        .then(() => { document.getElementById('syncCopy').textContent = 'Copied'; setTimeout(paintSync, 1200); })
        .catch(() => prompt('Copy the code:', sync.code));
    };
    document.getElementById('syncOff').onclick = async () => {
      if (!confirm('Stop syncing on this device? The list stays here and on the server; other devices keep working.')) return;
      sync.code = null; await saveSyncMeta(); paintSync();
    };
  }
}

/* catch up whenever the app comes back to the foreground */
document.addEventListener('visibilitychange', () => { if (!document.hidden) pullSync(); });

/* offline support — only meaningful when served over https */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

load();
</script>
</body>
</html>
